­ни­ях могут быть данные других людей и твои.</p><p class="pc-small" style="margin-top:8px"><span class="pc-tbd long">юрист про­ве­рит · со­труд­ни­ки не читают чаты — только если ре­а­ли­зо­ва­но и под­твер­жде­но; «сор­ти­ру­ет по­став­щик ИИ» — только если так и есть; га­лоч­ка «до­бро­со­вест­но» — только для «Что-то не­за­кон­ное»</span></p><div style="margin-top:12px"><button class="pc-check" role="checkbox" aria-checked="false" type="button"><span class="bx"></span><span class="t">Раз­ре­шаю мо­де­ра­то­ру от­крыть вло­же­ние / го­ло­со­вое / про­то­кол звонка этого со­об­ще­ния.</span></button></div><h2 class="pc-sech">Что дальше</h2><p class="pc-p" style="margin-top:0">Жалобу про­чи­та­ет со­труд­ник Parrlo Chat. Мы ис­поль­зу­ем со­об­ще­ния только для раз­бо­ра жалобы и не по­ка­зы­ва­ем их другим участ­ни­кам. Автору со­об­ще­ния мы не го­во­рим, что жалоба от тебя. Копию храним до 90 дней после ре­ше­ния, запись о ре­ше­нии — 12 ме­ся­цев, потом уда­ля­ем.</p><p class="pc-ph">Опе­ра­тор: PADELADA WORLD, S.L. · NIF [за­пол­нить] · hello@parrlo.com · [По­ли­ти­ка кон­фи­ден­ци­аль­но­сти]</p><div style="margin-top:12px"><button class="pc-check" role="checkbox" aria-checked="false" type="button"><span class="bx"></span><span class="t">Я до­бро­со­вест­но считаю, что со­об­щён­ное мной верно и полно.</span></button></div><div style="margin-top:12px"><button class="pc-check" role="checkbox" aria-checked="false" type="button"><span class="bx"></span><span class="t">За­бло­ки­ро­вать этого поль­зо­ва­те­ля</span></button></div></div></div></div><div class="pc-onb-actions"><button class="pc-btn" type="button">От­пра­вить жалобу (со­об­ще­ний: 3)</button><button class="pc-btn" type="button">От­пра­вить только это со­об­ще­ние</button><button class="pc-btn pc-btn--text" type="button" style="align-self:center">Отмена</button></div></div></div><div class="pc-status se" aria-hidden="true"><span>9:41</span><span style="display:flex;align-items:center"><svg viewBox="0
